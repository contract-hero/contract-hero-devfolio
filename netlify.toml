[build]
  publish = "dist"
  command = "pnpm build && pnpm check"
  # Netlify's UI-installed Essential Gatsby plugin survives the Gatsby removal; tell it to stand down.
  [build.environment]
    NETLIFY_SKIP_GATSBY_BUILD_PLUGIN = "true"
    NODE_VERSION = "22"

# Former project names remain valid on the consolidated host. Browser fragments survive these redirects.
[[redirects]]
  from = "/plugin-marketplace/*"
  to = "/plugins/:splat"
  status = 301

[[redirects]]
  from = "/display-v2-forum/*"
  to = "/display-v2/:splat"
  status = 301

[[redirects]]
  from = "/agentic-identity-crisis/*"
  to = "/learn/sui-dapp-testing/:splat"
  status = 301

[[redirects]]
  from = "/skypies-core/*"
  to = "/skypies/:splat"
  status = 301

# The Gatsby-era blog is gone; keep old inbound links alive.
[[redirects]]
  from = "/blog"
  to = "/"
  status = 301

[[redirects]]
  from = "/blog/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/rss.xml"
  to = "/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"

# The vlerv:// redirect page: never cached stale, never framed, and the
# fragment it reads is never sent here, so nothing to log.
[[headers]]
  for = "/vlerv/l/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
