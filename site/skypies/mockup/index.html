<style>
/* ==========================================================================
   skypies — color tokens (copy this block into the app's styles.css)
   Day is the default. Dusk applies under prefers-color-scheme: dark.
   --sky-*        the window background gradient, top → bottom
   --sky-line     wedge separators and hairlines that sit on the sky
   --sky-ink      UI text on the sky
   --pie-tone-1..3 the three wedge tones (white → pale blue → deep blue)
   --pie-wall     the side wall of a pie (the thickness under the top face)
   --crust        the one warm hairline around every pie
   --accent-sunset hover, the lifted slice, primary buttons
   --accent-rose   secondary accent (focus ring on dusk, chips)
   --accent-gold   tertiary accent (dusk crust, badges)
   ========================================================================== */
:root {
  --sky-top: #0b3d91;
  --sky-mid: #1e5bbf;
  --sky-bottom: #3f86e0;
  --sky-line: rgba(11, 61, 145, 0.35);
  --sky-ink: #ffffff;
  --sky-ink-dim: rgba(255, 255, 255, 0.9);
  --pie-tone-1: #ffffff;
  --pie-tone-2: #cfe3f6;
  --pie-tone-3: #7fb0e8;
  --pie-wall: #8fb8e6;
  --crust: #c89a5c;
  --accent-sunset: #ff8a3d;
  --accent-rose: #ff5e7e;
  --accent-gold: #ffd166;
  --chrome-bg: rgba(6, 30, 72, 0.30);
  --chrome-border: rgba(255, 255, 255, 0.28);
  --chrome-field: rgba(6, 30, 72, 0.38);
  --plate-bg: rgba(6, 30, 72, 0.86);
  --plate-row: rgba(255, 255, 255, 0.07);
  --focus: var(--accent-gold);
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, "Segoe UI", system-ui, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --sky-top: #1b1f5a;
    --sky-mid: #3a2d78;
    --sky-bottom: #8a3f6e;
    --sky-line: rgba(27, 31, 90, 0.7);
    --sky-ink: #fff3ec;
    --sky-ink-dim: rgba(255, 243, 236, 0.88);
    --pie-tone-1: #ffe1d1;
    --pie-tone-2: #ffa98a;
    --pie-tone-3: #d45f78;
    --pie-wall: #8d3f66;
    --crust: #ffd166;
    --chrome-bg: rgba(10, 8, 40, 0.36);
    --chrome-border: rgba(255, 255, 255, 0.18);
    --chrome-field: rgba(10, 8, 40, 0.46);
    --plate-bg: rgba(16, 14, 50, 0.9);
    --focus: var(--accent-gold);
  }
}

/* ---- window --------------------------------------------------------- */
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font-family: var(--font-ui);
  color: var(--sky-ink);
  background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 55%, var(--sky-bottom) 100%);
  background-attachment: fixed;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
.app { display: flex; flex-direction: column; height: 100dvh; }

/* ---- top bar (the only chrome — there is no sidebar) ---------------- */
.topbar {
  flex: 0 0 auto;
  display: flex; align-items: center; gap: 8px;
  height: 46px; padding: 0 10px 0 0;
  background: var(--chrome-bg);
  border-bottom: 1px solid var(--chrome-border);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  -webkit-app-region: drag;
}
.lights { display: flex; gap: 8px; width: 78px; padding-left: 13px; flex: 0 0 auto; }
.lights i { width: 12px; height: 12px; border-radius: 50%; background: rgba(255,255,255,0.35); border: 1px solid rgba(0,0,0,0.12); }
.lights i:nth-child(1) { background: #ff5f57; }
.lights i:nth-child(2) { background: #febc2e; }
.lights i:nth-child(3) { background: #28c840; }
.nav { display: flex; gap: 2px; }
.tb-btn {
  -webkit-app-region: no-drag;
  appearance: none; border: 0; background: transparent; color: var(--sky-ink);
  font: 500 13px/1 var(--font-ui); height: 30px; min-width: 30px; padding: 0 9px;
  border-radius: 8px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
}
.tb-btn:hover { background: var(--chrome-field); }
.tb-btn:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
.tb-btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tb-btn.primary { background: var(--accent-sunset); color: #1a0d00; font-weight: 600; }
.tb-btn.primary:hover { filter: brightness(1.06); }
.address {
  -webkit-app-region: no-drag;
  flex: 1 1 auto; min-width: 0; height: 30px;
  display: flex; align-items: center; gap: 8px; padding: 0 10px;
  background: var(--chrome-field); border: 1px solid var(--chrome-border); border-radius: 8px;
  font: 12.5px/1 var(--font-mono); color: var(--sky-ink);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.address .scheme { color: var(--sky-ink-dim); }
.address .badge { margin-left: auto; font: 500 11px/1 var(--font-ui); color: var(--sky-ink-dim); border: 1px solid var(--chrome-border); border-radius: 999px; padding: 4px 7px; }
@media (max-width: 640px) {
  .lights { width: 58px; padding-left: 10px; }
  .nav, .address .badge, .tb-btn .label { display: none; }
  .address { font-size: 12px; }
}

/* ---- the sky --------------------------------------------------------- */
.sky {
  flex: 1 1 auto; min-height: 0; position: relative;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-template-rows: repeat(2, 1fr);
  padding: 4vh 3vw 6vh;
}
@media (max-width: 640px) {
  .sky { grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(3, 1fr); padding: 2vh 2vw 4vh; }
}
.cell { position: relative; display: grid; place-items: center; min-width: 0; min-height: 0; }

/* the drift: translate only, per-pie duration and keyframe set */
.drift {
  position: relative;
  transform: translate(var(--jx, 0), var(--jy, 0));
  animation: var(--drift-name, drift-a) var(--drift-dur, 60s) ease-in-out infinite alternate;
  animation-delay: var(--drift-delay, 0s);
  will-change: transform;
}
.drift:hover, .drift:focus-within { animation-play-state: paused; z-index: 5; }
@keyframes drift-a { from { transform: translate(calc(var(--jx, 0) - 18px), calc(var(--jy, 0) + 6px)); } to { transform: translate(calc(var(--jx, 0) + 22px), calc(var(--jy, 0) - 10px)); } }
@keyframes drift-b { from { transform: translate(calc(var(--jx, 0) + 16px), calc(var(--jy, 0) - 8px)); } to { transform: translate(calc(var(--jx, 0) - 20px), calc(var(--jy, 0) + 8px)); } }
@keyframes drift-c { from { transform: translate(calc(var(--jx, 0) - 10px), calc(var(--jy, 0) - 12px)); } to { transform: translate(calc(var(--jx, 0) + 26px), calc(var(--jy, 0) + 4px)); } }
@keyframes drift-d { from { transform: translate(calc(var(--jx, 0) + 24px), calc(var(--jy, 0) + 10px)); } to { transform: translate(calc(var(--jx, 0) - 14px), calc(var(--jy, 0) - 6px)); } }

/* one pie = a button holding the SVG cloud + a label under it */
.pie {
  appearance: none; border: 0; background: transparent; padding: 0; margin: 0;
  color: inherit; font: inherit; cursor: grab;
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  width: var(--pie-w, clamp(150px, 20vw, 250px));
  transition: transform 420ms var(--ease);
  touch-action: pan-y;
  -webkit-user-select: none; user-select: none;
}
.pie:active { cursor: grabbing; }
.pie:focus-visible { outline: none; }
.pie:focus-visible .pie-3d { filter: drop-shadow(0 0 0 2px var(--focus)) drop-shadow(0 12px 24px rgba(0,0,0,0.25)); }
.drift:hover .pie, .drift:focus-within .pie { transform: scale(1.6); }
@media (max-width: 640px) {
  .drift:hover .pie, .drift:focus-within .pie { transform: scale(1.3); }
}
.pie-3d {
  width: 100%;
  transform: perspective(700px) rotateY(var(--yaw, 0deg));
  transform-style: preserve-3d;
  transition: transform 160ms linear, filter 200ms var(--ease);
  filter: drop-shadow(0 10px 22px rgba(0, 0, 0, 0.22));
}
.pie-cloud { display: block; width: 100%; height: auto; overflow: visible; }
.pie-cloud text { font-family: var(--font-mono); font-weight: 600; letter-spacing: 0.02em; }
.pie-cloud .wall { fill: var(--pie-wall); }
.pie-cloud .face { opacity: 0.62; }
.pie-cloud .wall-outline, .pie-cloud .crust { fill: none; stroke: var(--crust); stroke-width: 1; vector-effect: non-scaling-stroke; }
.pie-cloud .sep { fill: none; stroke: var(--sky-line); stroke-width: 1; vector-effect: non-scaling-stroke; }
.pie-cloud .wedge[data-front="true"] .sep { stroke: var(--accent-sunset); stroke-width: 2; }
.pie-cloud .wedge { transition: transform 220ms var(--ease); }
.pie-label {
  font: 500 13px/1.2 var(--font-ui); color: var(--sky-ink);
  text-shadow: 0 1px 2px rgba(0,0,0,0.35);
  display: flex; flex-direction: column; align-items: center; gap: 5px;
  transform: scale(1); transition: opacity 200ms var(--ease);
}
.pie-label .name { font-weight: 600; }
.pie-label .share { font: 11px/1 var(--font-mono); color: var(--sky-ink-dim); }
.legend { display: none; flex-wrap: wrap; justify-content: center; gap: 4px; max-width: 220px; }
.drift:hover .legend, .drift:focus-within .legend { display: flex; }
.drift:hover .share, .drift:focus-within .share { display: none; }
.chip {
  display: inline-flex; align-items: center; gap: 4px;
  font: 500 8px/1 var(--font-mono); color: #08214a;
  background: rgba(255,255,255,0.92); border-radius: 999px; padding: 3px 6px 3px 4px;
}
.chip i { width: 7px; height: 7px; border-radius: 50%; border: 1px solid rgba(0,0,0,0.2); }
.chip[data-front="true"] { background: var(--accent-sunset); color: #1a0d00; }
.hint {
  position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%);
  font: 11px/1.4 var(--font-ui); color: var(--sky-ink); text-align: center; white-space: nowrap;
  padding: 6px 12px; border-radius: 999px; background: var(--chrome-field); border: 1px solid var(--chrome-border);
  pointer-events: none;
}
@media (max-width: 640px) { .hint { display: none; } }

/* ---- plate overlay (second state) ----------------------------------- */
.scrim {
  position: fixed; inset: 0; z-index: 20;
  background: rgba(4, 20, 50, 0.35);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  display: none; align-items: center; justify-content: center; padding: 24px;
}
.scrim[data-open="true"] { display: flex; }
.plate {
  width: min(880px, 100%); max-height: min(620px, 100%);
  background: var(--plate-bg); color: var(--sky-ink);
  border: 1px solid var(--chrome-border); border-radius: 16px;
  box-shadow: 0 30px 80px rgba(0,0,0,0.45);
  display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: auto 1fr;
  overflow: hidden;
}
.plate-head { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--chrome-border); }
.plate-head h2 { margin: 0; font: 600 17px/1.2 var(--font-ui); letter-spacing: -0.01em; }
.plate-head .count { font: 12px/1 var(--font-mono); color: var(--sky-ink-dim); }
.plate-head .close { margin-left: auto; }
.plate-left { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 18px; min-height: 0; }
.plate-left .pie { --pie-w: min(340px, 80%); cursor: grab; }
.plate-left .pie-3d { filter: drop-shadow(0 18px 30px rgba(0,0,0,0.35)); }
.plate-left .rot { display: flex; gap: 6px; }
.plate-right { display: flex; flex-direction: column; min-height: 0; border-left: 1px solid var(--chrome-border); }
.plate-right h3 { margin: 0; padding: 12px 16px 6px; font: 600 11px/1 var(--font-ui); letter-spacing: 0.06em; text-transform: uppercase; color: var(--sky-ink-dim); }
.legend-rows { display: flex; flex-direction: column; padding: 0 8px; }
.legend-row {
  appearance: none; border: 0; background: transparent; color: inherit; cursor: pointer;
  display: grid; grid-template-columns: 14px 1fr auto auto; align-items: center; gap: 10px;
  padding: 7px 8px; border-radius: 8px; font: 13px/1 var(--font-ui); text-align: left;
}
.legend-row:hover { background: var(--plate-row); }
.legend-row[aria-checked="true"] { background: var(--plate-row); box-shadow: inset 0 0 0 1px var(--accent-sunset); }
.legend-row:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
.legend-row i { width: 12px; height: 12px; border-radius: 50%; border: 1px solid var(--crust); }
.legend-row .n, .legend-row .pct { font: 12px/1 var(--font-mono); color: var(--sky-ink-dim); }
.files { overflow: auto; padding: 0 8px 12px; }
.file-row {
  display: grid; grid-template-columns: 18px 1fr auto; align-items: center; gap: 10px;
  padding: 7px 8px; border-radius: 8px; font: 13px/1 var(--font-ui); text-decoration: none; color: inherit;
}
.file-row:hover { background: var(--plate-row); }
.file-row .k { font: 500 10px/1 var(--font-mono); color: #08214a; background: var(--pie-tone-2); border-radius: 4px; padding: 3px 0; text-align: center; }
.file-row .name { font-family: var(--font-mono); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.file-row .age { font: 11px/1 var(--font-mono); color: var(--sky-ink-dim); }
@media (max-width: 760px) {
  .scrim { padding: 10px; align-items: stretch; }
  .plate { grid-template-columns: 1fr; grid-template-rows: auto auto 1fr; max-height: 100%; }
  .plate-left { padding: 10px; }
  .plate-left .pie { --pie-w: 180px; }
  .plate-right { border-left: 0; border-top: 1px solid var(--chrome-border); }
}

/* ---- motion ---------------------------------------------------------- */
@media (prefers-reduced-motion: reduce) {
  .drift { animation: none; }
  .pie, .pie-3d, .pie-cloud .wedge, .pie-label { transition: none; }
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar" role="banner">
    <div class="lights" aria-hidden="true"><i></i><i></i><i></i></div>
    <div class="nav">
      <button class="tb-btn" type="button" aria-label="Back"><svg viewBox="0 0 16 16"><path d="M10 3 5 8l5 5"/></svg></button>
      <button class="tb-btn" type="button" aria-label="Forward"><svg viewBox="0 0 16 16"><path d="m6 3 5 5-5 5"/></svg></button>
    </div>
    <div class="address" role="textbox" aria-label="Address" aria-readonly="true" tabindex="0">
      <span class="scheme">skypies://</span><span>sky</span>
      <span class="badge">this Mac</span>
    </div>
    <button class="tb-btn" type="button" aria-label="Share"><svg viewBox="0 0 16 16"><path d="M8 10V2m0 0L5 5m3-3 3 3M3 8v5a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V8"/></svg><span class="label">Share</span></button>
    <button class="tb-btn" type="button" aria-label="Settings"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.4"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/></svg></button>
    <button class="tb-btn primary" type="button" id="new-pie"><svg viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></svg><span class="label">pie</span></button>
  </header>

  <main class="sky" id="sky" aria-label="Pies"></main>
  <p class="hint" aria-hidden="true">Hover a pie to see what it holds. Drag or press ← → to turn it. Click to open the plate.</p>
</div>

<div class="scrim" id="scrim" data-open="false" role="dialog" aria-modal="true" aria-labelledby="plate-title" aria-hidden="true">
  <section class="plate">
    <header class="plate-head">
      <h2 id="plate-title">Pie</h2>
      <span class="count" id="plate-count"></span>
      <button class="tb-btn close" type="button" id="plate-close" aria-label="Close">Esc</button>
    </header>
    <div class="plate-left" id="plate-left"></div>
    <aside class="plate-right">
      <h3>Kinds</h3>
      <div class="legend-rows" id="plate-legend" role="radiogroup" aria-label="File kinds"></div>
      <h3>Files</h3>
      <div class="files" id="plate-files"></div>
    </aside>
  </section>
</div>

<!-- ========================================================================
     makePieCloud(opts) — the MOCKUP's pie-cloud builder (sky band + plate).
     NOTE: the landing, desktop and ios pages use a different builder (the
     fluffy text-pie) under the same script id; do not copy this block there.
     It has no dependency on anything else on this page.

     opts = {
       id:      unique string, used as the prefix of every SVG id
       seed:    integer, picks the cloud silhouette
       wedges:  [{ kind: "html", count: 5 }, ...]   // clockwise from north
       width:   viewBox width  (default 240)
       height:  viewBox height (default 200)
       rows:    number of text rows (default 34)
       source:  array of strings used as the text rows (default: HTML source)
       label:   aria-label
     }
     Returns { svg: string, state: { rot: 0 }, wedges: [{kind,count,tone,start,end}] }
     After inserting the svg, call rotatePieCloud(svgEl, degrees) to turn it.
     ======================================================================== -->
<script id="pie-cloud-builder">
(function (global) {
  "use strict";

  var DEFAULT_SOURCE = [
    '<!doctype html><html lang="en"><head><meta charset="utf-8"><title>skypies</title><meta name="viewport" content="width=device-width, initial-scale=1"></head>',
    '<body class="sky"><main class="band" role="listbox" aria-label="Pies"><section class="pie" data-kind="html"><h2>Pricing</h2><ul class="files">',
    '<li><a href="skypies://open?path=%2Fdocs%2Fexplainer.html">explainer.html</a></li><li><a href="skypies://open?path=%2FREADME.md">README.md</a></li>',
    '<style>:root{--sky-top:#0b3d91;--sky-mid:#1e5bbf;--sky-bottom:#3f86e0;--crust:#c89a5c;--accent-sunset:#ff8a3d;--accent-rose:#ff5e7e}</style>',
    '<script>const pies=await ipc.listPies();for(const pie of pies.pies){band.append(renderPie(pie,{size:48,onOpen:openPlate}));}</' + 'script>',
    '<svg viewBox="0 0 200 200" aria-hidden="true"><path d="M100 100 L100 10 A90 90 0 0 1 190 100 Z" fill="var(--pie-tone-1)"/></svg>',
    '<nav class="topbar"><div class="lights"></div><input class="address" value="skypies://sky"><button>Share</button><button>+ pie</button></nav>',
    '<article class="artifact"><iframe sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;" title="explainer.html"></iframe></article>',
    '<meta property="og:title" content="skypies"><meta property="og:description" content="A reading room for the files your agents make.">',
    '<footer><a href="https://github.com/contract-hero/skypies-core">skypies-core</a> · Apache-2.0 · <a href="/desktop/">Desktop</a> · <a href="/ios/">iOS</a></footer></body></html>'
  ];

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function fmt(n) { return Math.round(n * 100) / 100; }

  /* A fluffy, lobed silhouette: a radial function with 3 harmonics plus a
     row of bigger "lobes" on the upper half and a flattened base. Returns
     the path d string. The centre is (cx, cy) and R is the mean radius. */
  function cloudPath(seed, cx, cy, R) {
    var rnd = mulberry32(seed);
    var lobeCount = 6 + Math.floor(rnd() * 3);          // 6..8 big lobes
    var lobes = [];
    for (var i = 0; i < lobeCount; i++) {
      lobes.push({ a: (i / lobeCount) * Math.PI * 2 + rnd() * 0.5, w: 0.18 + rnd() * 0.12, h: 0.22 + rnd() * 0.2 });
    }
    var h1 = { k: 2, a: 0.02 + rnd() * 0.03, p: rnd() * 6.28 };
    var h2 = { k: 3, a: 0.02 + rnd() * 0.02, p: rnd() * 6.28 };
    var N = 96, pts = [];
    for (var j = 0; j < N; j++) {
      var t = (j / N) * Math.PI * 2;
      var r = 1 + h1.a * Math.cos(h1.k * t + h1.p) + h2.a * Math.cos(h2.k * t + h2.p);
      for (var l = 0; l < lobes.length; l++) {
        var d = Math.atan2(Math.sin(t - lobes[l].a), Math.cos(t - lobes[l].a));
        var g = Math.exp(-(d * d) / (2 * lobes[l].w * lobes[l].w));
        r += lobes[l].h * g;
      }
      var x = cx + R * r * Math.cos(t) * 1.15;
      var y = cy + R * r * Math.sin(t) * 0.9;
      var base = cy + R * 0.62;
      if (y > base) y = base + (y - base) * 0.12;   // the flat cloud base
      pts.push([x, y]);
    }
    // Catmull-Rom → cubic Bézier for a smooth outline
    var d = "M" + fmt(pts[0][0]) + "," + fmt(pts[0][1]);
    for (var k = 0; k < N; k++) {
      var p0 = pts[(k - 1 + N) % N], p1 = pts[k], p2 = pts[(k + 1) % N], p3 = pts[(k + 2) % N];
      var c1x = p1[0] + (p2[0] - p0[0]) / 6, c1y = p1[1] + (p2[1] - p0[1]) / 6;
      var c2x = p2[0] - (p3[0] - p1[0]) / 6, c2y = p2[1] - (p3[1] - p1[1]) / 6;
      d += "C" + fmt(c1x) + "," + fmt(c1y) + " " + fmt(c2x) + "," + fmt(c2y) + " " + fmt(p2[0]) + "," + fmt(p2[1]);
    }
    return d + "Z";
  }

  /* A sector from the centre, angles in degrees clockwise from north,
     large enough to cover the whole cloud. */
  function sectorPath(cx, cy, big, a0, a1) {
    var pt = function (a) { var r = (a - 90) * Math.PI / 180; return fmt(cx + big * Math.cos(r)) + "," + fmt(cy + big * Math.sin(r)); };
    var d = "M" + cx + "," + cy + " L" + pt(a0);
    for (var a = a0 + 6; a < a1; a += 6) d += " L" + pt(a);
    return d + " L" + pt(a1) + " Z";
  }

  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }

  function makePieCloud(opts) {
    var id = opts.id;
    var W = opts.width || 240, H = opts.height || 200;
    var rows = opts.rows || 34;
    var source = opts.source || DEFAULT_SOURCE;
    var cx = W / 2, cy = H / 2 - 4, R = Math.min(W, H) * 0.36;
    var depth = Math.round(H * 0.05);
    var total = 0, i;
    for (i = 0; i < opts.wedges.length; i++) total += opts.wedges[i].count;
    // wedge angles, clockwise from north; tones cycle 1→2→3 with no equal neighbours at the seam
    var wedges = [], a = 0;
    for (i = 0; i < opts.wedges.length; i++) {
      var span = (opts.wedges[i].count / total) * 360;
      var tone = (i % 3) + 1;
      if (i === opts.wedges.length - 1 && wedges.length > 1 && tone === wedges[0].tone) tone = tone === 3 ? 2 : 3;
      wedges.push({ kind: opts.wedges[i].kind, count: opts.wedges[i].count, tone: tone, start: a, end: a + span, mid: a + span / 2 });
      a += span;
    }
    var cloud = cloudPath(opts.seed || 1, cx, cy, R);
    var pitch = H / rows, fs = pitch * 1.3;
    var out = [];
    out.push('<svg class="pie-cloud" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(opts.label || "Pie") + '" data-cx="' + cx + '" data-cy="' + cy + '">');
    out.push('<defs>');
    out.push('<clipPath id="' + id + '-cloud"><path d="' + cloud + '"/></clipPath>');
    for (i = 0; i < wedges.length; i++) {
      out.push('<clipPath id="' + id + '-w' + i + '"><path d="' + sectorPath(cx, cy, R * 3, wedges[i].start, wedges[i].end) + '"/></clipPath>');
    }
    // the text rows: one symbol, reused per wedge with a different fill
    out.push('<symbol id="' + id + '-rows" overflow="visible"><g font-size="' + fmt(fs) + '" xml:space="preserve">');
    for (i = 0; i < rows; i++) {
      var line = source[i % source.length];
      var shift = (i * 7) % Math.max(1, line.length - 20);
      line = line.slice(shift) + " " + line.slice(0, shift);
      out.push('<text x="0" y="' + fmt(pitch * (i + 0.9)) + '" textLength="' + W + '" lengthAdjust="spacingAndGlyphs">' + esc(line) + '</text>');
    }
    out.push('</g></symbol>');
    out.push('</defs>');
    // the side wall: the same cloud, pushed down by `depth`, in the wall tone
    out.push('<g class="wall-g" transform="translate(0,' + depth + ')">');
    out.push('<path class="wall" d="' + cloud + '"/>');
    out.push('<g clip-path="url(#' + id + '-cloud)" opacity="0.55"><use href="#' + id + '-rows" fill="var(--pie-tone-3)"/></g>');
    out.push('<path class="wall-outline" d="' + cloud + '"/>');
    out.push('</g>');
    // the top face: one wedge group per kind, text rows clipped by cloud ∩ sector
    out.push('<g class="top">');
    for (i = 0; i < wedges.length; i++) {
      var w = wedges[i];
      out.push('<g class="wedge" data-kind="' + w.kind + '" data-mid="' + fmt(w.mid) + '" data-front="false">');
      out.push('<g clip-path="url(#' + id + '-cloud)"><g class="spin" transform="rotate(0 ' + cx + ' ' + cy + ')">');
      out.push('<g clip-path="url(#' + id + '-w' + i + ')"><g class="unspin" transform="rotate(0 ' + cx + ' ' + cy + ')"><rect class="face" x="-' + W + '" y="-' + H + '" width="' + (W * 3) + '" height="' + (H * 3) + '" fill="var(--pie-tone-' + w.tone + ')"/><use href="#' + id + '-rows" fill="var(--pie-tone-' + w.tone + ')"/></g></g>');
      out.push('<path class="sep" d="' + sectorPath(cx, cy, R * 1.9, w.start, w.end) + '"/>');
      out.push('</g></g></g>');
    }
    out.push('<path class="crust" d="' + cloud + '"/>');
    out.push('</g>');
    out.push('</svg>');
    return { svg: out.join(""), wedges: wedges, state: { rot: 0 } };
  }

  /* Turn a rendered pie cloud by `rot` degrees around its vertical axis:
     the sectors spin in-plane while the text stays horizontal, the wedge
     that faces the viewer (south) is marked data-front and lifted out. */
  function rotatePieCloud(svg, rot) {
    var cx = +svg.dataset.cx, cy = +svg.dataset.cy;
    var spins = svg.querySelectorAll(".spin"), unspins = svg.querySelectorAll(".unspin");
    var i;
    for (i = 0; i < spins.length; i++) spins[i].setAttribute("transform", "rotate(" + rot + " " + cx + " " + cy + ")");
    for (i = 0; i < unspins.length; i++) unspins[i].setAttribute("transform", "rotate(" + (-rot) + " " + cx + " " + cy + ")");
    var wedges = svg.querySelectorAll(".wedge"), best = null, bestD = 1e9;
    for (i = 0; i < wedges.length; i++) {
      var mid = (+wedges[i].dataset.mid + rot) % 360; if (mid < 0) mid += 360;
      var d = Math.abs(((mid - 180 + 540) % 360) - 180);   // distance from south
      if (d < bestD) { bestD = d; best = i; }
    }
    for (i = 0; i < wedges.length; i++) {
      var front = i === best;
      wedges[i].setAttribute("data-front", front ? "true" : "false");
      if (front) {
        var r = ((+wedges[i].dataset.mid + rot) - 90) * Math.PI / 180;
        wedges[i].setAttribute("transform", "translate(" + fmt(Math.cos(r) * 7) + "," + fmt(Math.sin(r) * 7) + ")");
        wedges[i].parentNode.appendChild(wedges[i]);
        var crust = svg.querySelector(".top > .crust"); if (crust) crust.parentNode.insertBefore(crust, wedges[i]);
      } else {
        wedges[i].removeAttribute("transform");
      }
    }
    return svg.querySelectorAll(".wedge")[best] ? svg.querySelectorAll(".wedge")[best].dataset.kind : null;
  }

  global.makePieCloud = makePieCloud;
  global.rotatePieCloud = rotatePieCloud;
})(window);
</script>

<script>
(function () {
  "use strict";
  // Mock data. Names and files are placeholders for a mockup, not real pies.
  var PIES = [
    { id: "pricing", name: "Pricing", seed: 11, wedges: [{ kind: "html", count: 5 }, { kind: "md", count: 3 }, { kind: "code", count: 2 }],
      files: ["pricing-explainer.html", "tiers-comparison.html", "checkout-flow.html", "faq.html", "index.html", "README.md", "decisions.md", "copy-review.md", "pricing.ts", "tiers.ts"] },
    { id: "landing", name: "Landing", seed: 23, wedges: [{ kind: "html", count: 7 }, { kind: "image", count: 4 }, { kind: "md", count: 2 }, { kind: "code", count: 1 }],
      files: ["index.html", "desktop.html", "ios.html", "hero-a.html", "hero-b.html", "sections.html", "footer.html", "icon.svg", "cloud.png", "shot-desktop.png", "shot-phone.png", "brief.md", "copy.md", "build-icon.ts"] },
    { id: "postmortem", name: "Postmortem", seed: 37, wedges: [{ kind: "md", count: 6 }, { kind: "html", count: 2 }, { kind: "data", count: 3 }],
      files: ["timeline.md", "root-cause.md", "actions.md", "notes-day1.md", "notes-day2.md", "summary.md", "timeline.html", "report.html", "errors.csv", "latency.json", "requests.csv"] },
    { id: "onboarding", name: "Onboarding", seed: 41, wedges: [{ kind: "html", count: 4 }, { kind: "md", count: 4 }, { kind: "text", count: 2 }, { kind: "image", count: 1 }],
      files: ["welcome.html", "first-run.html", "pairing.html", "shortcuts.html", "plan.md", "copy.md", "review.md", "qa.md", "notes.txt", "todo.txt", "flow.png"] },
    { id: "benchmarks", name: "Benchmarks", seed: 53, wedges: [{ kind: "data", count: 6 }, { kind: "html", count: 3 }, { kind: "code", count: 3 }],
      files: ["run-01.json", "run-02.json", "run-03.json", "baseline.csv", "compare.csv", "summary.json", "chart.html", "table.html", "report.html", "bench.ts", "collect.py", "plot.py"] },
    { id: "q3", name: "Q3 plan", seed: 67, wedges: [{ kind: "md", count: 5 }, { kind: "html", count: 2 }, { kind: "code", count: 1 }, { kind: "other", count: 1 }],
      files: ["goals.md", "roadmap.md", "risks.md", "hiring.md", "budget.md", "roadmap.html", "okrs.html", "estimate.ts", "deck.key"] }
  ];
  var KIND_EXT = { html: ["html"], md: ["md"], code: ["ts", "py", "rs", "js"], text: ["txt"], image: ["png", "svg", "jpg"], data: ["json", "csv"], other: [] };
  var DRIFT = [
    { name: "drift-a", dur: "58s", delay: "-12s", jx: "-6%", jy: "4%" },
    { name: "drift-b", dur: "74s", delay: "-30s", jx: "8%", jy: "-8%" },
    { name: "drift-c", dur: "46s", delay: "-5s", jx: "-4%", jy: "-6%" },
    { name: "drift-d", dur: "88s", delay: "-40s", jx: "6%", jy: "6%" },
    { name: "drift-a", dur: "66s", delay: "-22s", jx: "-9%", jy: "-3%" },
    { name: "drift-c", dur: "52s", delay: "-15s", jx: "5%", jy: "8%" }
  ];
  var reducedMq = window.matchMedia("(prefers-reduced-motion: reduce)");

  function shareLabel(wedges) {
    return wedges.map(function (w) { return w.kind + " " + w.count; }).join(" · ");
  }
  function kindOf(file) {
    var ext = file.split(".").pop();
    for (var k in KIND_EXT) if (KIND_EXT[k].indexOf(ext) >= 0) return k;
    return "other";
  }

  /* One controller shared by the sky pies and the plate pie: drag or
     arrow keys change `rot`; the SVG spins, the 3D face yaws, chips follow. */
  function attachPieControls(btn, svg, built, onFront) {
    var rot = 0, dragging = false, startX = 0, startRot = 0, moved = false;
    var face = btn.querySelector(".pie-3d");
    function apply() {
      var front = rotatePieCloud(svg, rot);
      var yaw = reducedMq.matches ? 0 : 28 * Math.sin(rot * Math.PI / 180);
      face.style.setProperty("--yaw", yaw.toFixed(2) + "deg");
      if (onFront) onFront(front);
    }
    btn.addEventListener("pointerdown", function (e) {
      if (e.button !== 0) return;
      dragging = true; moved = false; startX = e.clientX; startRot = rot;
      btn.setPointerCapture(e.pointerId);
    });
    btn.addEventListener("pointermove", function (e) {
      if (!dragging) return;
      var dx = e.clientX - startX;
      if (Math.abs(dx) > 4) moved = true;
      rot = startRot + dx * 0.9; apply();
    });
    function end(e) { if (!dragging) return; dragging = false; }
    btn.addEventListener("lostpointercapture", function () { dragging = false; });
    btn.addEventListener("pointerup", end);
    btn.addEventListener("pointercancel", end);
    btn.addEventListener("click", function (e) { if (moved) { e.preventDefault(); e.stopImmediatePropagation(); moved = false; } }, true);
    btn.addEventListener("keydown", function (e) {
      if (e.key === "ArrowLeft") { rot -= 30; apply(); e.preventDefault(); }
      else if (e.key === "ArrowRight") { rot += 30; apply(); e.preventDefault(); }
    });
    apply();
    return { rotateBy: function (d) { rot += d; apply(); }, get: function () { return rot; } };
  }

  function buildPie(pie, idx) {
    var built = makePieCloud({ id: "sky-" + pie.id, seed: pie.seed, wedges: pie.wedges, label: pie.name + ": " + shareLabel(pie.wedges) });
    var cell = document.createElement("div"); cell.className = "cell";
    var drift = document.createElement("div"); drift.className = "drift";
    var d = DRIFT[idx % DRIFT.length];
    drift.style.setProperty("--drift-name", d.name);
    drift.style.setProperty("--drift-dur", d.dur);
    drift.style.setProperty("--drift-delay", d.delay);
    drift.style.setProperty("--jx", d.jx);
    drift.style.setProperty("--jy", d.jy);
    var btn = document.createElement("button");
    btn.type = "button"; btn.className = "pie"; btn.setAttribute("aria-label", pie.name + " — " + shareLabel(pie.wedges) + ". Enter opens, left and right arrows turn.");
    btn.dataset.pieId = pie.id;
    var chips = built.wedges.map(function (w) {
      return '<span class="chip" data-kind="' + w.kind + '" data-front="false"><i style="background:var(--pie-tone-' + w.tone + ')"></i>' + w.kind + ' ' + w.count + '</span>';
    }).join("");
    btn.innerHTML = '<div class="pie-3d">' + built.svg + '</div>' +
      '<div class="pie-label"><span class="name">' + pie.name + '</span><span class="share">' + shareLabel(pie.wedges) + '</span><span class="legend">' + chips + '</span></div>';
    var svg = btn.querySelector("svg");
    attachPieControls(btn, svg, built, function (front) {
      var cs = btn.querySelectorAll(".chip");
      for (var i = 0; i < cs.length; i++) cs[i].setAttribute("data-front", cs[i].dataset.kind === front ? "true" : "false");
    });
    btn.addEventListener("click", function () { openPlate(pie); });
    drift.appendChild(btn); cell.appendChild(drift);
    return cell;
  }

  var sky = document.getElementById("sky");
  PIES.forEach(function (p, i) { sky.appendChild(buildPie(p, i)); });

  /* ---- plate ---------------------------------------------------------- */
  var scrim = document.getElementById("scrim");
  var lastFocus = null, plateCtl = null, cutKind = null;
  function openPlate(pie) {
    lastFocus = document.activeElement;
    document.getElementById("plate-title").textContent = pie.name;
    document.getElementById("plate-count").textContent = pie.files.length + " files · " + shareLabel(pie.wedges);
    var built = makePieCloud({ id: "plate-" + pie.id, seed: pie.seed, wedges: pie.wedges, rows: 44, label: pie.name });
    var left = document.getElementById("plate-left");
    left.innerHTML = '<div class="pie" tabindex="0" role="img" aria-label="' + pie.name + ' pie. Drag or use left and right arrows to turn."><div class="pie-3d">' + built.svg + '</div></div>' +
      '<div class="rot"><button class="tb-btn" type="button" data-rot="-45" aria-label="Turn left">←</button><button class="tb-btn" type="button" data-rot="45" aria-label="Turn right">→</button></div>';
    var pieEl = left.querySelector(".pie"), svg = left.querySelector("svg");
    var legend = document.getElementById("plate-legend");
    cutKind = null;
    function renderLegend(front) {
      legend.innerHTML = built.wedges.map(function (w) {
        var pct = Math.round((w.count / pie.files.length) * 100);
        return '<button class="legend-row" type="button" role="radio" data-kind="' + w.kind + '" aria-checked="' + (cutKind === w.kind) + '" tabindex="' + (w.kind === (cutKind || front) ? 0 : -1) + '">' +
          '<i style="background:var(--pie-tone-' + w.tone + ')"></i><span>' + w.kind + (w.kind === front ? ' <small style="color:var(--accent-sunset)">front</small>' : '') + '</span><span class="n">' + w.count + '</span><span class="pct">' + pct + '%</span></button>';
      }).join("");
    }
    function renderFiles() {
      var files = document.getElementById("plate-files");
      files.innerHTML = pie.files.filter(function (f) { return !cutKind || kindOf(f) === cutKind; }).map(function (f, i) {
        return '<a class="file-row" href="#" data-todo="opens the file in a tab in the real app"><span class="k">' + kindOf(f).slice(0, 2) + '</span><span class="name">' + f + '</span><span class="age">' + (i + 1) + 'h ago</span></a>';
      }).join("");
    }
    plateCtl = attachPieControls(pieEl, svg, built, function (front) { renderLegend(front); });
    renderFiles();
    legend.onclick = function (e) {  // assigned, not added: openPlate runs per open and must not stack handlers
      var row = e.target.closest(".legend-row"); if (!row) return;
      cutKind = cutKind === row.dataset.kind ? null : row.dataset.kind;
      var rows = legend.querySelectorAll(".legend-row");
      for (var i = 0; i < rows.length; i++) rows[i].setAttribute("aria-checked", rows[i].dataset.kind === cutKind ? "true" : "false");
      renderFiles();
    };
    left.querySelector(".rot").addEventListener("click", function (e) {
      var b = e.target.closest("[data-rot]"); if (b) plateCtl.rotateBy(+b.dataset.rot);
    });
    scrim.setAttribute("data-open", "true"); scrim.setAttribute("aria-hidden", "false");
    document.getElementById("plate-close").focus();
  }
  function closePlate() {
    scrim.setAttribute("data-open", "false"); scrim.setAttribute("aria-hidden", "true");
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }
  document.getElementById("plate-close").addEventListener("click", closePlate);
  scrim.addEventListener("pointerdown", function (e) { if (e.target === scrim) closePlate(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && scrim.dataset.open === "true") closePlate(); });

  // Test hook for screenshots: ?plate=<id> opens a plate.
  var q = new URLSearchParams(location.search);
  if (q.get("plate")) { var p = PIES.filter(function (x) { return x.id === q.get("plate"); })[0]; if (p) openPlate(p); }
  window.__skyPies = PIES;
})();
</script>
